AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CampusMeet shared M1 stack for Cognito, profile, group, invitation and notification APIs.

Parameters:
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173
  DataTablePrefix:
    Type: String
    Default: campusmeet-dev
    AllowedPattern: '^[a-z0-9-]+$'

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: false }
      MfaConfiguration: 'OFF'
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AWS::StackName}-web'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type, x-request-id, idempotency-key]
        AllowOrigins: [!Ref AllowedOrigin]
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}'
              audience: [!Ref UserPoolClient]

  AuthIntegrationFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteFunctionLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-api:*'
        - PolicyName: CampusMeetCoreData
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadWriteM1Tables
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTablePrefix}-identity'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTablePrefix}-identity/index/*'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTablePrefix}-collaboration'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTablePrefix}-collaboration/index/*'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTablePrefix}-meeting-data'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTablePrefix}-meeting-data/index/*'
              - Sid: ReadVerifiedCognitoEmail
                Effect: Allow
                Action: cognito-idp:AdminGetUser
                Resource: !GetAtt UserPool.Arn

  AuthIntegrationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [services/api/src/auth-integration.ts]
        Target: es2022
        Minify: false
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      CodeUri: ..
      Handler: services/api/src/auth-integration.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt AuthIntegrationFunctionRole.Arn
      Environment:
        Variables:
          IDENTITY_TABLE: !Sub '${DataTablePrefix}-identity'
          COLLABORATION_TABLE: !Sub '${DataTablePrefix}-collaboration'
          MEETING_DATA_TABLE: !Sub '${DataTablePrefix}-meeting-data'
          USER_POOL_ID: !Ref UserPool
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
            Auth: { Authorizer: NONE }
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: '/{proxy+}'
            Method: ANY
            Auth: { Authorizer: CognitoAuthorizer }
        Preflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: '/{proxy+}'
            Method: OPTIONS
            Auth: { Authorizer: NONE }

  AuthIntegrationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: 7

Outputs:
  UserPoolId: { Value: !Ref UserPool }
  UserPoolClientId: { Value: !Ref UserPoolClient }
  ApiUrl: { Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}' }
  IdentityTableName: { Value: !Sub '${DataTablePrefix}-identity' }
  CollaborationTableName: { Value: !Sub '${DataTablePrefix}-collaboration' }
  MeetingDataTableName: { Value: !Sub '${DataTablePrefix}-meeting-data' }
