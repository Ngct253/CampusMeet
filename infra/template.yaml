AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CampusMeet target application infrastructure using the shared five-table DynamoDB data foundation.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  DataTablePrefix:
    Type: String
    Default: campusmeet-dev
    AllowedPattern: '^[a-z0-9-]+$'
    Description: Prefix of the separately deployed DynamoDB data foundation.
  DomainName:
    Type: String
    Default: example.invalid
    Description: TODO(M5) Domain to configure after DNS ownership is confirmed.
  GoogleSecretReference:
    Type: String
    Default: /campusmeet/dev/google-oauth
    NoEcho: true
    Description: Secrets Manager or Parameter Store reference only; never put the secret value here.
  UserContentBucketName:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    Description: Name of the M4-owned private user-content bucket; this stack does not create it.
  BedrockEmbeddingModelId:
    Type: String
    Default: cohere.embed-multilingual-v3
    AllowedValues: [cohere.embed-multilingual-v3]
    Description: Multilingual embedding model configured for the M5 knowledge base.
  BedrockEmbeddingDimensions:
    Type: Number
    Default: 1024
    AllowedValues: [1024]
    Description: Vector dimension required by Cohere Embed Multilingual v3.
  BedrockGenerationModelArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:bedrock:[^:]+:[^:]*:(foundation-model|inference-profile|application-inference-profile)/.+$'
    Description: Model or inference-profile ARN passed to Converse and scoped in the worker policy.

Rules:
  RequireResolvedAIInfrastructure:
    Assertions:
      - Assert: !Not [!Equals [!Ref UserContentBucketName, replace-with-m4-user-content-bucket]]
        AssertDescription: UserContentBucketName must be the real M4 stack output.
      - Assert:
          !Not [
            !Equals [
              !Ref BedrockGenerationModelArn,
              'arn:aws:bedrock:ap-southeast-1::foundation-model/replace-with-approved-model-id',
            ],
          ]
        AssertDescription: BedrockGenerationModelArn must be an approved model resource.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
    Tags: &SamTags
      Project: CampusMeet
      Environment: !Ref Environment
      ManagedBy: IaC

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      Tags: &ResourceTags
        - { Key: Project, Value: CampusMeet }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: IaC }

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'campusmeet-${Environment}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'CampusMeet ${Environment} static frontend'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Origins:
          - Id: frontend-s3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOriginAccessControl
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          ForwardedValues: { QueryString: false, Cookies: { Forward: none } }
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html }
      Tags: *ResourceTags

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type, x-request-id, idempotency-key]
        AllowOrigins: ['*'] # TODO(M5): replace with the deployed CloudFront domain.
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}'
              audience: [!Ref UserPoolClient]
      Tags: *SamTags

  ApiLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'campusmeet-${Environment}-api'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: CampusMeetApiDataAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadWriteCampusMeetDataFoundation
                Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                  - dynamodb:TransactWriteItems
                Resource:
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTablePrefix}-identity'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTablePrefix}-identity/index/*'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTablePrefix}-collaboration'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTablePrefix}-collaboration/index/*'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTablePrefix}-meeting-data'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTablePrefix}-meeting-data/index/*'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTablePrefix}-task-data'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTablePrefix}-task-data/index/*'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTablePrefix}-ai-work'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTablePrefix}-ai-work/index/*'
              - Sid: ManageCampusMeetSchedules
                Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                  - scheduler:UpdateSchedule
                  - scheduler:DeleteSchedule
                Resource: !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/campusmeet-*'
              - Sid: PassReminderRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt SchedulerExecutionRole.Arn
              - Sid: ReadAuthenticatedUserProfile
                Effect: Allow
                Action: cognito-idp:AdminGetUser
                Resource: !GetAtt UserPool.Arn
      Tags: *ResourceTags

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [services/api/src/index.ts]
        Target: es2022
        Minify: false
    Properties:
      CodeUri: ..
      Handler: services/api/src/index.handler
      Role: !GetAtt ApiLambdaRole.Arn
      Environment:
        Variables:
          IDENTITY_TABLE: !Sub '${DataTablePrefix}-identity'
          COLLABORATION_TABLE: !Sub '${DataTablePrefix}-collaboration'
          MEETING_DATA_TABLE: !Sub '${DataTablePrefix}-meeting-data'
          TASK_DATA_TABLE: !Sub '${DataTablePrefix}-task-data'
          AI_WORK_TABLE: !Sub '${DataTablePrefix}-ai-work'
          USER_POOL_ID: !Ref UserPool
          GOOGLE_SECRET_REFERENCE: !Ref GoogleSecretReference
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
            Auth: { Authorizer: NONE }
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: '/{proxy+}'
            Method: ANY
            Auth: { Authorizer: CognitoAuthorizer }
      Tags: *SamTags

  KnowledgeVectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Tags:
        - { Key: Project, Value: CampusMeet }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: IaC }
        - { Key: Component, Value: AI }
        - { Key: Module, Value: M5 }

  KnowledgeVectorIndex:
    Type: AWS::S3Vectors::Index
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      VectorBucketArn: !GetAtt KnowledgeVectorBucket.VectorBucketArn
      DataType: float32
      Dimension: !Ref BedrockEmbeddingDimensions
      DistanceMetric: cosine
      Tags:
        - { Key: Project, Value: CampusMeet }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: IaC }
        - { Key: Component, Value: AI }
        - { Key: Module, Value: M5 }

  KnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'campusmeet-${Environment}-knowledge-base'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*'
      Policies:
        - PolicyName: CampusMeetKnowledgeBaseEmbedding
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeConfiguredEmbeddingModel
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockEmbeddingModelId}'
        - PolicyName: CampusMeetKnowledgeBaseSource
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListNormalizedKnowledgeSources
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${UserContentBucketName}'
                Condition:
                  StringLike:
                    s3:prefix: [kb, 'kb/*']
              - Sid: ReadNormalizedKnowledgeSources
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${UserContentBucketName}/kb/*'
        - PolicyName: CampusMeetKnowledgeBaseVectorIndex
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadWriteConfiguredVectorIndex
                Effect: Allow
                Action:
                  - s3vectors:PutVectors
                  - s3vectors:GetVectors
                  - s3vectors:DeleteVectors
                  - s3vectors:QueryVectors
                  - s3vectors:GetIndex
                Resource: !GetAtt KnowledgeVectorIndex.IndexArn
      Tags:
        - { Key: Project, Value: CampusMeet }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: IaC }
        - { Key: Component, Value: AI }
        - { Key: Module, Value: M5 }

  CampusMeetKnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    Properties:
      Name: !Sub 'campusmeet-${Environment}-knowledge'
      Description: Group-scoped CampusMeet sources with filterable authorization metadata.
      RoleArn: !GetAtt KnowledgeBaseRole.Arn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockEmbeddingModelId}'
          EmbeddingModelConfiguration:
            BedrockEmbeddingModelConfiguration:
              Dimensions: !Ref BedrockEmbeddingDimensions
              EmbeddingDataType: FLOAT32
      StorageConfiguration:
        Type: S3_VECTORS
        S3VectorsConfiguration:
          IndexArn: !GetAtt KnowledgeVectorIndex.IndexArn
      Tags:
        Project: CampusMeet
        Environment: !Ref Environment
        ManagedBy: IaC
        Component: AI
        Module: M5

  CampusMeetKnowledgeDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      Name: !Sub 'campusmeet-${Environment}-sources'
      Description: Approved normalized CampusMeet sources under the M5 knowledge prefix.
      KnowledgeBaseId: !Ref CampusMeetKnowledgeBase
      DataDeletionPolicy: DELETE
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !Sub 'arn:${AWS::Partition}:s3:::${UserContentBucketName}'
          BucketOwnerAccountId: !Ref AWS::AccountId
          InclusionPrefixes: [kb/]
      VectorIngestionConfiguration:
        ChunkingConfiguration:
          ChunkingStrategy: FIXED_SIZE
          FixedSizeChunkingConfiguration:
            MaxTokens: 300
            OverlapPercentage: 20

  AIWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'campusmeet-${Environment}-ai-worker'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: CampusMeetAIWorkerDataAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadWriteAIWorkItems
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTablePrefix}-ai-work'
              - Sid: ReadFinalMeetingTranscriptSegments
                Effect: Allow
                Action: dynamodb:Query
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTablePrefix}-meeting-data'
              - Sid: ReadGroupProgressSnapshots
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTablePrefix}-task-data'
        - PolicyName: CampusMeetAIWorkerSourceAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadUserContentSources
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${UserContentBucketName}/*'
              - Sid: WriteNormalizedKnowledgeSources
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${UserContentBucketName}/kb/*'
        - PolicyName: CampusMeetAIWorkerBedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: RetrieveFromConfiguredKnowledgeBase
                Effect: Allow
                Action: bedrock:Retrieve
                Resource: !GetAtt CampusMeetKnowledgeBase.KnowledgeBaseArn
              - Sid: ManageConfiguredDataSourceIngestion
                Effect: Allow
                Action:
                  - bedrock:StartIngestionJob
                  - bedrock:GetIngestionJob
                Resource: !GetAtt CampusMeetKnowledgeBase.KnowledgeBaseArn
              - Sid: InvokeConfiguredGenerationModel
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Ref BedrockGenerationModelArn
      Tags:
        - { Key: Project, Value: CampusMeet }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: IaC }
        - { Key: Component, Value: AI }
        - { Key: Module, Value: M5 }

  AIWorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [services/ai-worker/src/index.ts]
        Target: es2022
        Minify: false
        Sourcemap: true
    Properties:
      CodeUri: ..
      Handler: services/ai-worker/src/index.handler
      Role: !GetAtt AIWorkerRole.Arn
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          AI_WORK_TABLE: !Sub '${DataTablePrefix}-ai-work'
          MEETING_DATA_TABLE: !Sub '${DataTablePrefix}-meeting-data'
          TASK_DATA_TABLE: !Sub '${DataTablePrefix}-task-data'
          USER_CONTENT_BUCKET: !Ref UserContentBucketName
          BEDROCK_KNOWLEDGE_BASE_ID: !Ref CampusMeetKnowledgeBase
          BEDROCK_DATA_SOURCE_ID: !GetAtt CampusMeetKnowledgeDataSource.DataSourceId
          BEDROCK_GENERATION_MODEL_ID: !Ref BedrockGenerationModelArn
          NODE_OPTIONS: --enable-source-maps
      Tags:
        Project: CampusMeet
        Environment: !Ref Environment
        ManagedBy: IaC
        Component: AI
        Module: M5

  ReminderLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'campusmeet-${Environment}-reminder'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: ReminderDelivery
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadMeetingAndWriteNotification
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTablePrefix}-meeting-data'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTablePrefix}-meeting-data/index/*'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTablePrefix}-identity'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTablePrefix}-identity/index/*'
              - Sid: SendReminderEmail
                Effect: Allow
                Action: ses:SendEmail
                Resource: '*' # TODO(M5): scope after SES identities are known.
      Tags: *ResourceTags

  ReminderFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [services/api/src/index.ts]
        Target: es2022
        Minify: false
    Properties:
      CodeUri: ..
      Handler: services/api/src/index.reminderHandler
      Role: !GetAtt ReminderLambdaRole.Arn
      Environment:
        Variables:
          MEETING_DATA_TABLE: !Sub '${DataTablePrefix}-meeting-data'
          IDENTITY_TABLE: !Sub '${DataTablePrefix}-identity'
          SES_CONFIGURATION_SET: !Ref SesConfigurationSet
      Tags: *SamTags

  SchedulerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'campusmeet-${Environment}-scheduler'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeReminderOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ReminderFunction.Arn
      Tags: *ResourceTags

  DeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'campusmeet-${Environment}-deployment-placeholder'
      Description: TODO(M5) Placeholder; replace with a reviewed CI deployment role before enabling deploy.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: !Sub 'cloudformation.${AWS::URLSuffix}' }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadStackOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: '*'
      Tags: *ResourceTags

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'campusmeet-${Environment}'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: false }
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      DeletionProtection: INACTIVE # TODO(M5): enable for production after cleanup policy is agreed.
      UserPoolTags: *SamTags

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'campusmeet-${Environment}-web'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED

  SesConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties: { Name: !Sub 'campusmeet-${Environment}' }

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ApiFunction}'
      RetentionInDays: 14
      Tags: *ResourceTags

  ReminderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ReminderFunction}'
      RetentionInDays: 14
      Tags: *ResourceTags

  AIWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AIWorkerFunction}'
      RetentionInDays: 14
      Tags:
        - { Key: Project, Value: CampusMeet }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: IaC }
        - { Key: Component, Value: AI }
        - { Key: Module, Value: M5 }

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'campusmeet-${Environment}-alarms'
      Tags: *ResourceTags

  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'campusmeet-${Environment}-api-errors'
      AlarmDescription: TODO(M5) Tune threshold from observed demo traffic.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      Tags: *ResourceTags

  AIWorkerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'campusmeet-${Environment}-ai-worker-errors'
      AlarmDescription: Alerts when the AI Worker returns an unhandled error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref AIWorkerFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      Tags:
        - { Key: Project, Value: CampusMeet }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: IaC }
        - { Key: Component, Value: AI }
        - { Key: Module, Value: M5 }

  AIWorkerDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'campusmeet-${Environment}-ai-worker-duration'
      AlarmDescription: Alerts when an AI Worker invocation approaches its five-minute timeout.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions: [{ Name: FunctionName, Value: !Ref AIWorkerFunction }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 240000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      Tags:
        - { Key: Project, Value: CampusMeet }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: IaC }
        - { Key: Component, Value: AI }
        - { Key: Module, Value: M5 }

Outputs:
  FrontendBucketName: { Value: !Ref FrontendBucket }
  CloudFrontDomainName: { Value: !GetAtt FrontendDistribution.DomainName }
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}'
  UserPoolId: { Value: !Ref UserPool }
  UserPoolClientId: { Value: !Ref UserPoolClient }
  DataTablePrefix: { Value: !Ref DataTablePrefix }
  IdentityTableName: { Value: !Sub '${DataTablePrefix}-identity' }
